<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ADI Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* Стили для вкладок */
  .tabs { display: flex; background: #2c3e50; box-shadow: 0 2px 5px rgba(0,0,0,0.2); flex-shrink: 0; }
  .tab-btn { flex: 1; padding: 16px; border: none; background: transparent; color: #bdc3c7; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.2s; border-bottom: 3px solid transparent; }
  .tab-btn.active { color: white; background: #34495e; border-bottom: 3px solid #3498db; }
  .tab-btn:active { background: #1a252f; }

  /* Стили для контента (iframe) */
  .tab-content { flex: 1; display: none; width: 100%; height: 100%; }
  .tab-content.active { display: block; }
  iframe { width: 100%; height: 100%; border: none; background: white; }
</style>
</head>
<body>

  <!-- Вкладки переключения -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('pressure', this)">📊 Давление</button>
    <button class="tab-btn" onclick="switchTab('velocity', this)">💨 Скорость</button>
  </div>

  <!-- Контейнеры с генераторами -->
  <div id="pressure" class="tab-content active">
    <iframe src="./calculator_Pressure.html" loading="lazy"></iframe>
  </div>
  
  <div id="velocity" class="tab-content">
    <iframe src="./calculator_Velocity.html" loading="lazy"></iframe>
  </div>

  <script>
    function switchTab(tabId, btnElement) {
      // Скрываем все вкладки
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      // Показываем нужную
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
    }
  </script>
</body>
</html>
