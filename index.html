<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ADI Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; flex-direction: column; }
  
  .tabs { display: flex; background: #2c3e50; flex-shrink: 0; position: sticky; top: 0; z-index: 10; }
  .tab-btn { flex: 1; padding: 14px; border: none; background: transparent; color: #bdc3c7; font-size: 15px; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; }
  .tab-btn.active { color: white; background: #34495e; border-bottom: 3px solid #3498db; }
  .tab-btn:active { background: #1a252f; }

  .tab-content { display: none; flex: 1; overflow-y: auto; }
  .tab-content.active { display: block; }
  
  iframe { width: 100%; height: 100vh; border: none; background: white; }
  .loading { text-align: center; padding: 40px; color: #7f8c8d; font-size: 16px; }
</style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('pressure', this)">📊 Давление</button>
    <button class="tab-btn" onclick="switchTab('velocity', this)">💨 Скорость</button>
  </div>

  <div id="pressure" class="tab-content active">
    <div class="loading">Загрузка...</div>
  </div>
  
  <div id="velocity" class="tab-content">
    <div class="loading">Загрузка...</div>
  </div>

  <script>
    const isLocal = location.protocol === 'file:';
    
    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
    }

    async function loadGenerators() {
      if (isLocal) {
        // Локально: используем iframe (fetch не работает с file://)
        document.getElementById('pressure').innerHTML = '<iframe src="./calculator_Pressure.html"></iframe>';
        document.getElementById('velocity').innerHTML = '<iframe src="./calculator_Velocity.html"></iframe>';
      } else {
        // Через сервер (GitHub Pages, Live Server): загружаем через fetch — без лагов
        try {
          const [pRes, vRes] = await Promise.all([
            fetch('./calculator_Pressure.html'),
            fetch('./calculator_Velocity.html')
          ]);
          const pHtml = await pRes.text();
          const vHtml = await vRes.text();
          document.getElementById('pressure').innerHTML = pHtml;
          document.getElementById('velocity').innerHTML = vHtml;
        } catch (e) {
          // Если fetch упал — откатываемся на iframe
          document.getElementById('pressure').innerHTML = '<iframe src="./calculator_Pressure.html"></iframe>';
          document.getElementById('velocity').innerHTML = '<iframe src="./calculator_Velocity.html"></iframe>';
        }
      }
    }
    
    loadGenerators();
  </script>
</body>
</html>
