<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ADI Calculator</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2c3e50">
<link rel="apple-touch-icon" href="./icon-192.jpg">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; display: flex; flex-direction: column; overflow: hidden; }
  
  .tabs { display: flex; background: #2c3e50; flex-shrink: 0; z-index: 10; }
  .tab-btn { flex: 1; padding: 14px; border: none; background: transparent; color: #bdc3c7; font-size: 15px; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; }
  .tab-btn.active { color: white; background: #34495e; border-bottom: 3px solid #3498db; }
  .tab-btn:active { background: #1a252f; }

  .tab-content { display: none; flex: 1; min-height: 0; }
  .tab-content.active { display: block; }
  iframe { width: 100%; height: 100%; border: none; background: white; }
</style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('pressure', this)">📊 Давление</button>
    <button class="tab-btn" onclick="switchTab('velocity', this)">💨 Скорость</button>
  </div>

  <div id="pressure" class="tab-content active">
    <iframe src="./calculator_Pressure.html"></iframe>
  </div>
  
  <div id="velocity" class="tab-content">
    <iframe src="./calculator_Velocity.html"></iframe>
  </div>

  <script>
    function switchTab(tabId, btnElement) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btnElement.classList.add('active');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .then(() => console.log('Service Worker зарегистрирован'))
        .catch(err => console.log('Ошибка SW:', err));
    }
  </script>
</body>
</html>
